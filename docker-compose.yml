services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GOOGLE_SERVICE_ACCOUNT_FILE: /app/secrets/google_service_account.json
    volumes:
      - ./secrets:/app/secrets:ro
      - ./static:/app/static:ro
      - ./ecommerce_agent:/app/ecommerce_agent
