[project]
name = "ecommerce-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-api-python-client>=2.199.0",
    "google-auth>=2.57.0",
    "jupyter>=1.1.1",
    "langfuse>=4.15.1",
    "mlflow>=3.16.0",
    "openai>=2.53.0",
    "openai-agents>=0.19.4",
    "openinference-instrumentation-openai-agents>=2.2.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.32",
    "prometheus-client>=0.21.0",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.51",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecommerce_agent"]

[tool.hatch.build.targets.wheel.force-include]
"ecommerce_agent/agent/instructions.md" = "ecommerce_agent/agent/instructions.md"

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true